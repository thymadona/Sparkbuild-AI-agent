name: CI

on:
  pull_request:
    branches:
      - main

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      # Postgres 17 to match production. The application talks to Postgres
      # directly over Drizzle + postgres.js, and the authorization rules live in
      # security-definer *functions*, so a real server is the only way to test
      # that they answer correctly rather than that we called them.
      #
      # This is a throwaway container created and destroyed with the job. It is
      # never any deployed database: migrations against those are run by hand,
      # deliberately, and are not part of this pipeline.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Named for the test database directly, so the job needs no
          # createdb step and no second database it would never read.
          POSTGRES_DB: spark_build_test
        ports:
          - 5432:5432
        # Without a health check the first step can race the server's startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Real Redis for the same reason: the rate limit is enforced by a Lua
      # script running inside the server, so a mock could only assert that we
      # called it, never that it counts correctly or stays atomic.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # These three are the entire environment the suite needs — verified by
    # running it with nothing else set. Everything that used to be here was a
    # placeholder for `bun run build`, which Vercel now owns.
    #
    # DATABASE_URL is deliberately left UNSET: lib/db/client.ts refuses to run
    # tests when TEST_DATABASE_URL equals it, and leaving it undefined means
    # there is no development database in this job for a test to reach at all.
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spark_build_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # --frozen-lockfile fails the run if bun.lock disagrees with package.json,
      # rather than silently resolving something different from what was reviewed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-blocking for now: `bun run lint` reports 6 pre-existing
      # no-html-link-for-pages errors (app/about, app/dashboard,
      # app/share/[id], components/Footer) and 1 no-page-custom-font warning,
      # all of which predate this workflow. Flip this to a blocking step once
      # those are fixed — leaving it red-but-ignored is the honest state, not
      # a permanent exemption.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      # Kept even though Vercel's build also typechecks: this reports in seconds
      # on the PR itself, rather than only inside a deployment log.
      - name: Typecheck
        run: bunx tsc --noEmit

      # jest.globalSetup.ts applies ./drizzle to TEST_DATABASE_URL before any
      # suite runs — against the service container above, never a real database.
      # That is a precondition of running the tests at all, not a deployment step.
      - name: Test
        run: bun run test
